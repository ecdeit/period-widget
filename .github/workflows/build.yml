name: Build Debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The hosted runner already ships Temurin 17 and a full Android SDK at
      # $ANDROID_HOME. What it does NOT do is put sdkmanager on PATH (that is
      # done by android-actions/setup-android, which this workflow deliberately
      # avoids). So sdkmanager is located explicitly instead of assumed.
      - name: Ensure Android SDK packages
        run: |
          set -e
          echo "JDK:"; java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          echo "sdkmanager -> ${SDKMANAGER:-<not found>}"

          if [ -n "$SDKMANAGER" ]; then
            export PATH="$(dirname "$SDKMANAGER"):$PATH"
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            # Licences may still need accepting on a fresh image, hence yes.
            yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          fi

          echo "--- cmdline-tools layout ---"
          find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 2>/dev/null || true
          echo "--- installed platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          echo "--- installed build-tools ---"
          ls "$ANDROID_HOME/build-tools" || true

          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
